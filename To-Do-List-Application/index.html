<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List Application</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="header-icon" aria-hidden="true">✓</div>
      <div>
        <h1>To-Do List</h1>
        <p>Plan · Do · Achieve</p>
      </div>
    </header>

    <section class="content" aria-label="Task manager">
      <form id="task-form" class="add-form">
        <label class="sr-only" for="task-input">New task</label>
        <input id="task-input" type="text" placeholder="Enter a new task..." maxlength="120" autocomplete="off">
        <button type="submit" class="add-button">＋ <span>Add Task</span></button>
      </form>

      <nav class="filters" aria-label="Filter tasks">
        <div class="filter-buttons">
          <button type="button" class="filter active" data-filter="all">All (<span id="all-count">0</span>)</button>
          <button type="button" class="filter" data-filter="pending">Pending (<span id="pending-count">0</span>)</button>
          <button type="button" class="filter" data-filter="completed">Completed (<span id="completed-count">0</span>)</button>
        </div>
        <p class="summary"><span id="summary-pending">0 pending</span><span class="dot">·</span><span id="summary-completed">0 completed</span></p>
      </nav>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state">No tasks yet. Add one to get started!</p>
      <footer>Small steps make big goals! ☺</footer>
    </section>
  </main>
</body>
</html>
